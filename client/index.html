<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- ======================================
         BASIC SEO
    ======================================= -->

    <title>
      SkillPath | Skill-to-Career Navigator
    </title>

    <meta
      name="description"
      content="SkillPath helps you discover suitable technology career paths, measure your career readiness, identify skill gaps, and follow a personalized learning roadmap."
    />

    <meta
      name="application-name"
      content="SkillPath"
    />

    <meta
      name="theme-color"
      content="#0f1020"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- ======================================
         FAVICON
    ======================================= -->

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- ======================================
         OPEN GRAPH
         LinkedIn / WhatsApp / Facebook
    ======================================= -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="SkillPath"
    />

    <meta
      property="og:title"
      content="SkillPath | Skill-to-Career Navigator"
    />

    <meta
      property="og:description"
      content="Discover your ideal technology career path, understand your skill gaps, measure career readiness, and follow a personalized roadmap with SkillPath."
    />

    <meta
      property="og:url"
      content="https://skill-to-career-navigator.vercel.app"
    />

    <meta
      property="og:image"
      content="https://skill-to-career-navigator.vercel.app/images/skillpath-preview.png"
    />

    <meta
      property="og:image:alt"
      content="SkillPath career guidance and personalized roadmap preview"
    />

    <!-- ======================================
         X / TWITTER
    ======================================= -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="SkillPath | Skill-to-Career Navigator"
    />

    <meta
      name="twitter:description"
      content="Discover your ideal technology career path and build a personalized learning roadmap with SkillPath."
    />

    <meta
      name="twitter:image"
      content="https://skill-to-career-navigator.vercel.app/images/skillpath-preview.png"
    />

    <meta
      name="twitter:image:alt"
      content="SkillPath career guidance and personalized roadmap preview"
    />

    <!-- ======================================
         CANONICAL URL
    ======================================= -->

    <link
      rel="canonical"
      href="https://skill-to-career-navigator.vercel.app"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
